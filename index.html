<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/treasury-tracker-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/treasury-tracker-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/treasury-tracker-favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Follow your tax dollars. Treasury Tracker turns dense public budgets into an interactive view of where the money goes and what it pays for." />
    <meta name="keywords" content="city budget, public spending, budget tracker, civic engagement, government finances" />
    <meta name="author" content="Empowered.Vote" />
    <!-- ⚠⚠ MANROPE IS LOADED HERE, NOT FROM index.css, AND THAT IS THE FIX.
         The stylesheet carried `@import url(...Manrope...)`. Tailwind v4 inlines
         its own `@import "tailwindcss"` ahead of it, so in the BUILT css the
         font import no longer preceded every other rule — which the spec
         requires — and it was dropped outright. `npm run build` said so on
         every build ("@import rules must precede all rules aside from @charset
         and @layer statements") and the warning was not a style nit: measured
         on production 2026-10-10, the page made ZERO font requests,
         `document.fonts.size` was 0, and every element rendered in the system
         fallback while computed `font-family` still read "Manrope, sans-serif".
         A <link> cannot be reordered out of existence by a bundler, and the
         preconnects remove a round-trip the @import could never avoid. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" />
    <title>Treasury Tracker</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Empowered Vote" />
    <meta property="og:title" content="Treasury Tracker" />
    <meta property="og:description" content="Follow your tax dollars. Treasury Tracker turns dense public budgets into an interactive view of where the money goes and what it pays for." />
    <meta property="og:url" content="https://treasurytracker.empowered.vote/" />
    <meta property="og:image" content="https://treasurytracker.empowered.vote/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Resolve the theme before first paint. The ev_theme cookie on .empowered.vote is the
      // cross-app truth, so it is read FIRST: localStorage is per-origin, and reading it first
      // let a stale local value beat a newer choice the visitor made on another EV site.
      //
      // Dark is the default and the OS is never consulted. A browser reports
      // prefers-color-scheme: light when the OS has no preference set at all, so reading it
      // could not tell "never chose" apart from "chose light", and every undecided visitor
      // got a light page. Only a choice made on an Empowered Vote site counts.
      (function(){var m=document.cookie.match(/(?:^|;\s*)ev_theme=([^;]+)/);var s=m?m[1]:null;if(!s){try{s=localStorage.getItem('ev:color-scheme')}catch(e){}}if(s!=='light')document.documentElement.classList.add('dark')})();
    </script>
    <script src="https://js.givebutter.com/elements/latest.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
