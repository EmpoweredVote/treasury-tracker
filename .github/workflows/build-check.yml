name: Build check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # ⚠ Until 2026-08-19 this workflow ran the build and nothing else, so NONE
      # of the tests gated a PR -- including the guards written specifically to
      # stop defects reaching main (the NUL-byte lint, the paged-read ordering
      # check, the unconstrained-sum check). They passed locally and were inert
      # here, which is the "harness nobody runs" shape this project keeps
      # rediscovering.
      #
      # Added only after the I/O-bound tests were given explicit timeouts: they
      # scan the source tree, so their duration tracks disk contention, and
      # vitest's default 5s made them fail under load. A flaky required check is
      # worse than no check.
      - run: npm test
      # ⚠⚠ AND THE SAME OMISSION SURVIVED IN PYTHON UNTIL 2026-09-04, a third
      # time. `npm test` is vitest only, so the extractor selftests -- 183 in
      # `acfrGF.selftest.py` and 39 in `acfrGfCoords.selftest.py` -- had NEVER
      # run on a pull request. They pin genuinely subtle rules: dash-zero rows,
      # welded-label indent, row chaining, the parent/root-leaf inversion, and
      # now the statement_page resolution. All of it was inert here.
      #
      # ⚠ `test:acfr` invoked `py -3` by name. That happens to work on the
      # primary developer machine today, but there is no `py` on an ubuntu
      # runner, and the Microsoft Store alias trap that lib/pythonBin.mjs exists
      # for can be re-armed by a Windows update. `scripts/runPythonTests.mjs`
      # RESOLVES an interpreter via that existing helper, and FAILS -- rather
      # than skipping -- when a suite's dependency is missing, so this step
      # cannot quietly go back to measuring nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: npm run test:acfr

  # Browser journeys (e2e/): the PR's own build, served by `vite preview`,
  # driven by Playwright against the LIVE API through a same-origin proxy (the
  # live API's CORS allows only production origins). A separate job so it runs
  # beside `build` rather than after it. Signed out and read-only.
  #
  # ⚠ A live-API outage is not the PR's fault: the preflight in
  # e2e/global-setup.ts then skips every journey and this job passes with a
  # warning. Only failures after a green preflight are red.
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      - if: always()
        run: |
          if [ -f e2e/.api-down ]; then
            echo "::warning::Journeys couldn't run — live API down. Not this PR's fault; rerun when the API is back."
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
